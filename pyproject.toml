[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vk-bot"
version = "0.1.0"
description = "VK-бот-консультант агентства ИИ-Апгрейд"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "vkbottle>=4.11",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/vk_bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# BLE: широкий `except Exception` допустим только с `# noqa: BLE001` и причиной
select = ["E4", "E7", "E9", "F", "I", "UP", "BLE", "RUF"]
# RUF001–003 принимают кириллицу в русских текстах за похожие латинские буквы
ignore = ["RUF001", "RUF002", "RUF003"]
